name: CI

# One job on JDK 17, the baseline: every build compiles with `release 17`, so the bytecode does not depend on the
# JDK, and 17 is the oldest runtime users have. Pull requests: build, tests, Javadoc and the JPMS consumer smoke test.
# Pushes to master and release tags add coverage and the SonarCloud analysis (not gating); master then publishes a
# SNAPSHOT.
on:
  push:
    branches: [master]
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.claude/**'
      - '.github/workflows/claude.yml'
      - '.github/renovate.json'
      - '.gitignore'
  # To run it on any branch by hand.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request or branch ends the run it replaces, except on master, where a run may be
# publishing a SNAPSHOT: there a newer merge waits instead of cancelling an upload half way.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  build:
    name: Build (JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # SonarCloud needs the history to attribute new code.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '1' }}
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880  # v6.3.0
        with:
          java-version: '17'
          distribution: temurin
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USER
          server-password: CENTRAL_TOKEN_PASSWORD

      - name: Build, test and Javadoc
        if: github.event_name != 'push'
        run: mvn --batch-mode --no-transfer-progress verify javadoc:javadoc

      - name: Build, test, Javadoc and coverage
        if: github.event_name == 'push'
        run: mvn --batch-mode --no-transfer-progress verify javadoc:javadoc -P coverage

      # Analysis only: a SonarCloud outage or token problem must not stop the SNAPSHOT, so this step does not gate.
      - name: SonarCloud
        if: github.event_name == 'push'
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONARCLOUD_TOKEN }}
        run: mvn --batch-mode --no-transfer-progress -P sonar org.sonarsource.scanner.maven:sonar-maven-plugin:sonar

      - name: JPMS consumer smoke test
        run: src/it/consumer/run.sh

      # Every change merged to master is published as a SNAPSHOT to the Central Portal snapshot repository
      # (https://central.sonatype.com/repository/maven-snapshots/). Releases are never published from CI.
      - name: Publish SNAPSHOT
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          CENTRAL_TOKEN_USER: ${{ secrets.CENTRAL_TOKEN_USER }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
        run: |
          version=$(sed -n 's/^version=//p' target/maven-archiver/pom.properties)
          # The release plugin pushes its "prepare release" commit (a release version) to master on its own. That
          # commit is not published here: releases are published by hand, so it is skipped. Any other non-SNAPSHOT
          # version on master (a hand edit of the POM) still fails, as does a missing version.
          subject=$(git log -1 --format=%s)
          case "$version" in
            '')
              echo "::error::no version in target/maven-archiver/pom.properties"; exit 1 ;;
            *-SNAPSHOT) ;;
            *)
              case "$subject" in
                "[maven-release-plugin] prepare release "*)
                  echo "::notice::release commit for $version; releases are published by hand, so no SNAPSHOT"; exit 0 ;;
                *)
                  echo "::error::master is at $version, not a SNAPSHOT, and this is not a release commit"; exit 1 ;;
              esac ;;
          esac
          mvn --batch-mode --no-transfer-progress deploy -P central -DskipTests
